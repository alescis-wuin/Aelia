name: CI

on:
  push:
    branches: [ main, develop, testing ]
  pull_request:
    branches: [ main, develop, testing ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn --batch-mode verify
