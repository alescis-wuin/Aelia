name: CI

on:
  pull_request:
    branches:
      - main
      - testing
      - develop
  push:
    branches:
      - main
      - testing
      - develop

permissions:
  contents: read

jobs:
  maven-verify:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B verify
